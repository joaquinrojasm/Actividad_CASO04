<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🧠 Reconocimiento KMNIST — FIX</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; text-align:center; background:#f5f6fa; color:#2f3640; padding:32px }
    #preview { display:none; margin-top:20px; width:140px; border-radius:8px; border:2px solid #718093; background:white; padding:10px }
    #resultado { font-size:1.2rem; margin-top:16px; font-weight:700 }
    #cargando { margin-top:10px; font-style:italic; color:#718093 }
    small { color:#555 }
  </style>
</head>
<body>
  <h2>🧩 Reconocimiento con modelo KMNIST (corregido)</h2>
  <p>Sube una imagen (preferiblemente 28x28). <small>Si abres el archivo con <code>file://</code> podrías tener problemas; sirve los archivos desde un servidor (por ejemplo: <code>python -m http.server</code> o <code>npx http-server</code>).</small></p>

  <input type="file" id="input-imagen" accept="image/*">
  <div id="cargando">Cargando modelo...</div>
  <img id="preview" alt="Vista previa de la imagen">
  <p id="resultado">Predicción: —</p>

  <script>
    const MODEL_PATH = 'modelo_kmnist_tfjs/model.json'; // ajusta si hace falta
    let modelo = null;
    let modeloTipo = null; // 'layers' o 'graph'

    async function comprobarRuta() {
      try {
        const r = await fetch(MODEL_PATH, {method: 'HEAD'});
        return r.ok;
      } catch (e) {
        console.warn('Fetch HEAD falló (posible CORS o file://):', e);
        return false;
      }
    }

    async function cargarModelo() {
      const ok = await comprobarRuta();
      if (!ok) {
        document.getElementById('cargando').innerText = '❌ No se pudo acceder a "' + MODEL_PATH + '". Revisa la ruta, CORS o si estás usando file://.';
        console.error('No se pudo acceder a', MODEL_PATH);
        return;
      }

      // Intentamos loadLayersModel primero (por compatibilidad con modelos Keras exportados)
      try {
        console.log('Intentando cargar como LayersModel...');
        modelo = await tf.loadLayersModel(MODEL_PATH);
        modeloTipo = 'layers';
        document.getElementById('cargando').innerText = '✅ Modelo (LayersModel) cargado correctamente.';
        console.log('Modelo cargado (LayersModel)', modelo);
        return;
      } catch (errLayers) {
        console.warn('loadLayersModel falló:', errLayers);
      }

      // Si falló, intentamos loadGraphModel
      try {
        console.log('Intentando cargar como GraphModel...');
        modelo = await tf.loadGraphModel(MODEL_PATH);
        modeloTipo = 'graph';
        document.getElementById('cargando').innerText = '✅ Modelo (GraphModel) cargado correctamente.';
        console.log('Modelo cargado (GraphModel)', modelo);
        return;
      } catch (errGraph) {
        console.error('loadGraphModel falló:', errGraph);
        document.getElementById('cargando').innerText = '❌ Error al cargar el modelo. Revisa consola (CORS / formato / versión TFJS).';
        return;
      }
    }

    // Función para extraer el tensor de salida de forma robusta
    async function extraerTensorSalida(posible) {
      // posible puede ser: Tensor, Array(Tensor), Object{name:Tensor}, Promise
      if (posible == null) return null;
      // Si es promesa, await
      if (typeof posible.then === 'function') {
        posible = await posible;
      }
      // Si es array -> tomar el primer tensor
      if (Array.isArray(posible)) {
        return posible[0];
      }
      // Si es objeto (mapa de nombres) -> tomar el primer valor que sea tensor
      if (typeof posible === 'object' && !(posible instanceof tf.Tensor)) {
        const vals = Object.values(posible);
        for (const v of vals) {
          if (v instanceof tf.Tensor) return v;
        }
      }
      if (posible instanceof tf.Tensor) return posible;
      return null;
    }

    async function predecir(imagen) {
      if (!modelo) { alert('El modelo aún no está cargado.'); return; }

      const tensor = tf.tidy(() => {
        // fromPixels -> [h,w,3]
        let t = tf.browser.fromPixels(imagen);
        // si ya es gris single channel, .mean(2) lo convertirá bien
        t = t.mean(2).toFloat();
        t = tf.image.resizeNearestNeighbor(t.expandDims(-1), [28,28]);
        t = t.div(255.0);
        t = t.expandDims(0); // [1,28,28,1]
        return t;
      });

      try {
        let salida;
        if (modeloTipo === 'layers') {
          salida = modelo.predict(tensor);
        } else if (modeloTipo === 'graph') {
          // GraphModel puede necesitar executeAsync/execute
          if (typeof modelo.executeAsync === 'function') {
            salida = await modelo.executeAsync(tensor);
          } else {
            salida = modelo.execute(tensor);
          }
        } else {
          // desconocido, intentar predict y execute
          try { salida = modelo.predict(tensor); } catch (e) { salida = await modelo.executeAsync(tensor); }
        }

        const tensorSalida = await extraerTensorSalida(salida);
        if (!tensorSalida) throw new Error('No se pudo interpretar la salida del modelo. Mira la consola para más info.');

        // obtener vector de probabilidades (1D) o valor
        let probs = tensorSalida;
        // si la salida tiene shape [1] (scalar), manejamos distinto
        const shape = probs.shape;
        let clase;
        if (shape.length === 0) {
          // scalar
          const v = probs.dataSync()[0];
          clase = Math.round(v);
        } else if (shape.length === 1 || (shape.length === 2 && shape[0] === 1)) {
          // vector de logits/probs -> argmax
          const v = probs.reshape([probs.size]);
          clase = v.argMax().dataSync()[0];
        } else if (shape.length === 2) {
          // [1, n] -> argmax a lo largo del eje 1
          clase = probs.argMax(1).dataSync()[0];
        } else {
          // forma inesperada
          console.warn('Forma de salida inesperada:', shape);
          clase = 0;
        }

        document.getElementById('resultado').innerText = 'Predicción: ' + clase;

        // limpiar tensores temporales
        if (tensorSalida !== salida && Array.isArray(salida)) {
          salida.forEach(s => { if (s && s.dispose) s.dispose(); });
        }
        if (tensorSalida && tensorSalida.dispose) tensorSalida.dispose();

      } catch (err) {
        console.error('Error en predicción:', err);
        document.getElementById('resultado').innerText = '❌ Error en predicción — mira la consola';
      } finally {
        tf.dispose(tensor);
      }
    }

    document.getElementById('input-imagen').addEventListener('change', (e) => {
      const archivo = e.target.files[0];
      if (!archivo) return;
      const img = new Image();
      img.onload = () => {
        const vista = document.getElementById('preview');
        vista.src = img.src;
        vista.style.display = 'block';
        predecir(img);
      };
      img.onerror = (ev) => { console.error('Error cargando imagen', ev); };
      img.src = URL.createObjectURL(archivo);
    });

    // arrancar
    cargarModelo();
  </script>
</body>
</html>
