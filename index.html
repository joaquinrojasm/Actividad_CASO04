<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Demo KMNIST con TensorFlow.js</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
</head>
<body>
  <h2>Reconocimiento con modelo KMNIST</h2>
  <input type="file" id="input-imagen" accept="image/*">
  <p id="resultado"></p>

  <script>
    let modelo;

    async function cargarModelo() {
      // Carga el modelo exportado desde la carpeta tfjs_kmnist_dir
      modelo = await tf.loadLayersModel('model.json');
      console.log("✅ Modelo cargado correctamente");
    }

    async function predecir(imagen) {
      const img = tf.browser.fromPixels(imagen, 1)
        .resizeNearestNeighbor([28, 28])
        .toFloat()
        .div(tf.scalar(255.0))
        .expandDims(0);

      const prediccion = modelo.predict(img);
      const clase = prediccion.argMax(1).dataSync()[0];
      document.getElementById("resultado").innerText = "Predicción: " + clase;
    }

    document.getElementById('input-imagen').addEventListener('change', (e) => {
      const img = new Image();
      img.onload = () => predecir(img);
      img.src = URL.createObjectURL(e.target.files[0]);
    });

    cargarModelo();
  </script>
</body>
</html>
